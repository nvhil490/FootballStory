<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FootballStory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b09;color:#f5f7f6;font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#214d35,#070b09 55%);padding:18px}
.screen{max-width:1050px;margin:auto}.card{background:#101713;border:1px solid #26342c;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0007}
h1,h2,h3,p{margin-top:0}.muted{color:#9da9a2}.eyebrow{color:#55e38f;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.btn{border:0;border-radius:13px;padding:13px 18px;background:#2fd477;color:#06100a;font-weight:900}.btn.dark{background:#1a2720;color:#fff;border:1px solid #304037}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.actions{display:flex;gap:10px;flex-wrap:wrap}
.home{min-height:calc(100vh - 36px);display:grid;place-items:center;text-align:center}.logo{font-size:clamp(48px,9vw,86px);letter-spacing:-5px;font-weight:950}.logo b{color:#35dd80}.home p{max-width:650px;line-height:1.6;margin:0 auto 30px}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.country-cat{background:#0b120e;border:1px solid #25342b;border-radius:17px;padding:16px}.country-cat h3{margin-bottom:12px}.country{width:100%;text-align:left;border:1px solid #25342b;background:#131d18;color:white;padding:10px;border-radius:10px;margin:4px 0}.country.selected{border-color:#35dd80;background:#173a28}
.custom{display:grid;grid-template-columns:340px 1fr;gap:24px}.avatarbox{background:#0a100d;border:1px solid #26342c;border-radius:20px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:510px}.avatar{width:260px;height:330px}.avatar svg{width:100%;height:100%}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.swatch.selected{border-color:#fff}.hair-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hair{padding:12px 8px;background:#111b16;color:#fff;border:1px solid #26342c;border-radius:11px}.hair.selected{border-color:#35dd80;background:#183d2b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#9da9a2}.field input,.field select{background:#09100c;border:1px solid #29382f;color:white;padding:12px;border-radius:11px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.club{padding:16px;text-align:left;border:1px solid #2a392f;background:#111b16;color:#fff;border-radius:14px}.club:hover{border-color:#35dd80}.club small{display:block;color:#9da9a2;margin-top:5px}
.careerhead{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}.stat{background:#0b110e;border:1px solid #26342c;border-radius:14px;padding:13px}.stat small{display:block;color:#8f9c94;font-size:11px}.stat strong{display:block;margin-top:4px}
.choice-list{display:grid;gap:11px}.eventchoice{padding:17px;border:1px solid #29382f;background:#121c17;color:#fff;border-radius:15px;text-align:left}.eventchoice:hover{border-color:#35dd80;background:#183225}.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#55e38f;margin-bottom:6px;font-weight:900}
.result{margin-top:15px;padding:15px;border-radius:13px;background:#0b120e;border:1px solid #26342c}.injury{border-color:#b94851}.bar{height:7px;background:#202c25;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#35dd80}
@media(max-width:800px){.custom{grid-template-columns:1fr}.avatarbox{min-height:390px}.avatar{width:220px;height:280px}.careerhead{grid-template-columns:1fr 1fr}.careerhead .stat:first-child{grid-column:1/-1}}
@media(max-width:520px){.app{padding:10px}.card{padding:17px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.hair-grid{grid-template-columns:1fr 1fr}}

/* FootballStory V1.1 — avatar presentation */
.avatar-card{position:relative;overflow:hidden;border:1px solid rgba(120,255,165,.18);background:radial-gradient(circle at 50% 25%,rgba(77,255,142,.08),transparent 38%),linear-gradient(180deg,#07100c 0%,#050907 100%)}
.avatar-stage{min-height:360px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.avatar-stage:after{content:"";position:absolute;width:220px;height:22px;bottom:26px;left:50%;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px)}
.avatar-head{position:relative;width:180px;height:215px;border-radius:48% 48% 44% 44%;background:var(--skin,#9b6245);box-shadow:0 18px 35px rgba(0,0,0,.28);z-index:2}
.avatar-neck{position:absolute;width:58px;height:72px;left:61px;bottom:-50px;border-radius:0 0 26px 26px;background:var(--skin,#9b6245)}
.avatar-hair{position:absolute;z-index:3;pointer-events:none}
.avatar-eyes{position:absolute;left:0;right:0;top:92px;display:flex;justify-content:center;gap:54px;z-index:4}
.avatar-eyes span{width:8px;height:8px;border-radius:50%;background:#171717}
.avatar-mouth{position:absolute;left:50%;top:133px;transform:translateX(-50%);width:38px;height:13px;border-bottom:3px solid #633f31;border-radius:0 0 50% 50%;z-index:4}
.hair-court{inset:0 10px auto;height:78px;border-radius:48% 48% 22% 22%;background:#17110f}
.hair-fade{inset:0 9px auto;height:92px;border-radius:48% 48% 35% 35%;background:#17110f}
.hair-fade:after{content:"";position:absolute;left:24px;right:24px;top:24px;height:40px;border-radius:50%;background:#211613}
.hair-longtop{inset:-5px 3px auto;height:118px;border-radius:48% 48% 38% 38%;background:#17110f}
.hair-curly{inset:-5px -2px auto;height:112px;border-radius:50%;background:#17110f}
.hair-afro{inset:-28px -30px auto;height:145px;border-radius:50%;background:#17110f;box-shadow:0 4px 0 #17110f}
.hair-dreads{inset:-8px -18px auto;height:155px;border-radius:48% 48% 30% 30%;background:transparent}
.hair-dreads:before,.hair-dreads:after{content:"";position:absolute;top:18px;width:28px;height:130px;border-radius:18px;background:repeating-linear-gradient(180deg,#17110f 0 12px,#241916 12px 18px)}
.hair-dreads:before{left:10px;transform:rotate(8deg)} .hair-dreads:after{right:10px;transform:rotate(-8deg)}
.hair-braids{inset:-4px -10px auto;height:120px;border-radius:45% 45% 20% 20%;background:repeating-linear-gradient(135deg,#17110f 0 10px,#33221b 10px 13px)}
.hair-medium{inset:-4px -8px auto;height:120px;border-radius:48% 48% 30% 30%;background:#17110f}
.hair-long{inset:-6px -14px auto;height:155px;border-radius:48% 48% 30% 30%;background:#17110f}
.hair-bald{display:none}

</style>
</head>
<body><div class="avatar-card" style="margin:16px auto;max-width:620px;border-radius:24px;padding:18px"><div class="avatar-stage"><div class="avatar-head" id="avatarVisual"><div class="avatar-hair hair-dreads" id="avatarHair"></div><div class="avatar-neck"></div><div class="avatar-eyes"><span></span><span></span></div><div class="avatar-mouth"></div></div></div><div style="text-align:center;padding:12px"><strong>Ton joueur</strong><br><span style="color:#9aa59f">Position à choisir</span></div></div><div class="app"><main id="app" class="screen"></main></div>
<script>
const countryCats={
"Europe":[["🇫🇷","France"],["🏴","Angleterre"],["🇩🇪","Allemagne"],["🇪🇸","Espagne"],["🇨🇭","Suisse"],["🇵🇹","Portugal"],["🇮🇹","Italie"],["🇳🇱","Pays-Bas"],["🇹🇷","Turquie"]],
"Scandinavie":[["🇸🇪","Suède"],["🇩🇰","Danemark"],["🇳🇴","Norvège"]],
"Africque":[["🇩🇿","Algérie"],["🇲🇦","Maroc"],["🇹🇳","Tunisie"],["🇨🇲","Cameroun"],["🇨🇮","Côte d’Ivoire"],["🇸🇳","Sénégal"],["🇨🇩","Congo RDC"],["🇪🇬","Égypte"]],
"Amérique":[["🇲🇽","Mexique"],["🇨🇴","Colombie"],["🇦🇷","Argentine"],["🇧🇷","Brésil"],["🇺🇸","États-Unis"],["🇨🇦","Canada"]]
};
const clubs={
L1:["Paris","Marseille","Lyon","Monaco","Lille","Rennes","Angers","Le Mans","Lens","Paris CF","Strasbourg","Auxerre","Brest","Lorient","Toulouse","Nice","Troyes","Le Havre"],
L2:["Saint-Étienne","Red Star","Reims","Montpellier","Metz","Nancy-Lorraine","Annecy","Sochaux-Montbéliard","Dijon","Pau","Guingamp","Dunkerque","Grenoble","Rodez","Nantes","Clermont","Boulogne","Laval"],
L3:["La Roche","Rouen","Concarneau","Versailles","Amiens","Cannes","Caen","Le Puy","Fleury","Thionville","Paris 13","Bastia","QRM","Orléans","Valenciennes","Aubagne","Bourg-en-Bresse","Villefranche"]};
const skins=["#f8dcc8","#edc2a5","#d9a17e","#bd805d","#965b3e","#70432f","#4b2b20"];
const hairs=["Court","Dégradé","Dégradé + dessus long","Bouclé","Afro","Dreadlocks","Tresses","Mi-long","Long","Rasé","Frange","Originale"];
const hairColors=[["Noir","#15110e"],["Brun","#4a2d1d"],["Châtain","#765035"],["Blond","#d8b46a"],["Roux","#9a4d2e"],["Gris","#9b9b91"]];
const positions=["BU","AG","AD","MOC","MC","DG","DD","DC","GK"];
const S={screen:"home",nation:null,skin:skins[3],haircut:"Dégradé",hairColor:"#15110e",first:"",last:"",birth:"",age:0,position:null,level:0,division:null,club:null,money:1000,season:1,confidence:50,performance:50,morale:50,coachRelation:50,teamRelation:50,form:50,last:null,clubChosen:false};

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ageFromDate(v){if(!v)return null;let d=new Date(v),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
function avatar(){
 const c=S.hairColor, skin=S.skin;
 const hairTop=`<path d="M69 120 Q65 43 130 35 Q195 43 191 120 Q177 96 160 104 Q145 82 130 101 Q111 81 97 104 Q80 96 69 120Z" fill="${c}"/>`;
 let hair=hairTop;
 if(S.haircut==="Rasé") hair=`<path d="M73 105 Q79 51 130 42 Q181 51 187 105 Q170 87 151 92 Q130 75 109 92 Q90 87 73 105Z" fill="${c}" opacity=".92"/>`;
 if(S.haircut==="Dégradé") hair=`<path d="M69 119 Q69 47 130 37 Q191 47 191 119 Q176 95 158 103 Q143 84 130 101 Q111 82 97 103 Q80 95 69 119Z" fill="${c}"/><path d="M75 116 Q78 73 91 61 L88 108Z M185 116 Q182 73 169 61 L172 108Z" fill="#000" opacity=".16"/>`;
 if(S.haircut==="Dégradé + dessus long") hair=`<path d="M70 120 Q67 50 130 28 Q193 50 190 120 Q177 93 159 103 Q143 79 130 96 Q110 76 96 102 Q80 93 70 120Z" fill="${c}"/><path d="M92 68 Q129 28 169 67 Q157 62 146 72 Q129 52 111 73 Q101 64 92 68Z" fill="${c}"/>`;
 if(S.haircut==="Bouclé") hair=`<g fill="${c}"><circle cx="84" cy="76" r="24"/><circle cx="105" cy="52" r="27"/><circle cx="130" cy="45" r="29"/><circle cx="157" cy="52" r="27"/><circle cx="177" cy="76" r="24"/><circle cx="76" cy="100" r="20"/><circle cx="184" cy="100" r="20"/></g>`;
 if(S.haircut==="Afro") hair=`<g fill="${c}"><circle cx="130" cy="88" r="70"/><circle cx="77" cy="94" r="24"/><circle cx="183" cy="94" r="24"/><circle cx="92" cy="54" r="24"/><circle cx="168" cy="54" r="24"/></g>`;
 if(S.haircut==="Dreadlocks") hair=`<path d="M70 119 Q67 45 130 35 Q193 45 190 119Z" fill="${c}"/>${Array.from({length:9},(_,i)=>{let x=77+i*13;let y=92+(i%2)*5;return `<path d="M${x} ${y} q-5 30 3 66 q7 12 14 0 q-5-35 2-64" fill="${c}"/>`}).join('')}`;
 if(S.haircut==="Tresses") hair=`<path d="M70 116 Q70 46 130 35 Q190 46 190 116Z" fill="${c}"/>${[82,98,114,130,146,162,178].map((x,i)=>`<path d="M${x} 63 q${i%2?8:-8} 24 0 48" fill="none" stroke="#0d0b0a" stroke-width="5" stroke-linecap="round" opacity=".45"/>`).join('')}`;
 if(S.haircut==="Mi-long") hair=`<path d="M69 116 Q66 40 130 35 Q194 40 191 116 L181 179 Q166 161 151 151 L130 164 L109 151 Q94 161 79 179Z" fill="${c}"/>`;
 if(S.haircut==="Long") hair=`<path d="M67 116 Q64 38 130 34 Q196 38 193 116 L187 230 Q169 201 151 178 L130 193 L109 178 Q91 201 73 230Z" fill="${c}"/>`;
 if(S.haircut==="Frange") hair=`<path d="M70 112 Q68 42 130 34 Q192 42 190 112 Q170 93 151 101 Q131 76 108 101 Q89 93 70 112Z" fill="${c}"/><path d="M94 88 Q130 69 165 88 L157 116 Q130 101 103 116Z" fill="${c}"/>`;
 if(S.haircut==="Originale") hair=`<path d="M70 118 Q68 40 130 34 Q192 40 190 118 Q170 91 153 104 Q131 79 108 104 Q88 91 70 118Z" fill="${c}"/><path d="M92 54 Q130 22 170 54" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 260 330" aria-label="Avatar" role="img">
 <ellipse cx="130" cy="310" rx="91" ry="14" fill="#000" opacity=".45"/>
 <path d="M63 307 Q68 230 104 215 Q130 205 156 215 Q192 230 197 307Z" fill="#f1f3f1"/>
 <path d="M99 216 L130 254 L161 216 L151 211 L130 239 L109 211Z" fill="#ffffff"/>
 <path d="M88 250 Q74 265 62 303" fill="none" stroke="#f7f8f7" stroke-width="20" stroke-linecap="round"/>
 <path d="M172 250 Q186 265 198 303" fill="none" stroke="#f7f8f7" stroke-width="20" stroke-linecap="round"/>
 <rect x="105" y="177" width="50" height="59" rx="22" fill="${skin}"/>
 <ellipse cx="130" cy="126" rx="57" ry="70" fill="${skin}"/>
 <ellipse cx="74" cy="132" rx="9" ry="17" fill="${skin}"/>
 <ellipse cx="186" cy="132" rx="9" ry="17" fill="${skin}"/>
 ${hair}
 <circle cx="108" cy="132" r="4.5" fill="#161b18"/><circle cx="152" cy="132" r="4.5" fill="#161b18"/>
 <path d="M113 160 Q130 169 147 160" fill="none" stroke="#6a3d30" stroke-width="4" stroke-linecap="round"/>
 <path d="M95 114 Q108 106 120 112 M140 112 Q152 106 165 114" fill="none" stroke="#3b241c" stroke-width="4" stroke-linecap="round" opacity=".75"/>
 </svg>`;
}
function home(){return `<section class="home"><div><div class="eyebrow">Mode carrière</div><h1 class="logo">Football<b>Story</b></h1><p>« Un nom, une nation, un club… et peut-être une des plus belles histoires qui va s’écrire. »</p><div class="actions" style="justify-content:center"><button class="btn" data-go="nation">Nouvelle partie</button><button class="btn dark" id="shop">Boutique</button></div><p id="shopmsg" class="muted"></p></div></section>`}
function nation(){return `<div class="card"><div class="row"><div><div class="eyebrow">Étape 1</div><h2>Choisis ta nation</h2></div></div><p class="muted">Choisis une nation parmi les catégories disponibles.</p><div class="countries">${Object.entries(countryCats).map(([cat,arr])=>`<section class="country-cat"><h3>${cat}</h3>${arr.map(([f,n])=>`<button class="country ${S.nation===n?"selected":""}" data-nation="${n}">${f} ${n}</button>`).join("")}</section>`).join("")}</div><div class="actions" style="margin-top:18px;justify-content:space-between"><button class="btn dark" data-go="home">Retour</button><button class="btn" data-go="custom" ${S.nation?"":"disabled"}>Continuer</button></div></div>`}
function custom(){return `<div class="card"><div class="row"><div><div class="eyebrow">Étape 2</div><h2>Crée ton joueur</h2></div><span class="muted">${S.nation}</span></div><div class="custom">
<div class="avatarbox"><div class="avatar">${avatar()}</div><strong>${esc(S.first||"Ton joueur")} ${esc(S.last)}</strong><span class="muted">${S.position||"Position à choisir"}</span></div>
<div>
<h3>Apparence</h3><div class="eyebrow" style="margin-bottom:8px">Couleur de peau</div><div class="swatches">${skins.map(x=>`<button class="swatch ${S.skin===x?"selected":""}" data-skin="${x}" style="background:${x}"></button>`).join("")}</div>
<div class="eyebrow" style="margin:18px 0 8px">Coupe de cheveux</div><div class="hair-grid">${hairs.map(x=>`<button class="hair ${S.haircut===x?"selected":""}" data-hair="${x}">${x}</button>`).join("")}</div>
<div class="eyebrow" style="margin:18px 0 8px">Couleur des cheveux</div><div class="swatches">${hairColors.map(([n,c])=>`<button title="${n}" class="swatch ${S.hairColor===c?"selected":""}" data-haircolor="${c}" style="background:${c}"></button>`).join("")}</div>
<h3 style="margin-top:22px">Identité</h3><div class="form">
<div class="field"><label>Prénom</label><input id="first" value="${esc(S.first)}"></div><div class="field"><label>Nom</label><input id="last" value="${esc(S.last)}"></div>
<div class="field"><label>Date de naissance</label><input id="birth" type="date" value="${S.birth}"></div>
<div class="field"><label>Position</label><select id="position"><option value="">Choisir</option>${positions.map(x=>`<option ${S.position===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
<div class="actions" style="margin-top:20px"><button class="btn dark" data-go="nation">Retour</button><button class="btn" id="toClub">Continuer vers le club</button></div>
</div></div></div>`}
function club(){let lvl=S.level;let div=S.division;
if(!S.offers){S.offers=[...clubs[div]].sort(()=>Math.random()-.5).slice(0,4);}
return `<div class="card"><div class="eyebrow">Étape 3 • Première signature</div><h2>4 clubs veulent vous recruter</h2><p class="muted">Votre niveau <b style="color:#fff">${lvl}</b> vous ouvre ces quatre possibilités en <b style="color:#fff">${div}</b>.</p><div class="notice" style="padding:12px;margin-bottom:15px">L3 : 40–55 &nbsp;•&nbsp; L2 : 55–65 &nbsp;•&nbsp; L1 : 65–99</div><div class="clubgrid">${S.offers.map((c,i)=>{let play=["Élevé","Moyen","Faible"][Math.min(2,Math.floor(Math.random()*3))];return `<button class="club" data-club="${c}"><span class="tag">Offre ${i+1}</span><b>${c}</b><small>${div} • Niveau ${lvl}</small><small>Temps de jeu estimé : ${play}</small></button>`}).join("")}</div><p class="muted" style="margin-top:15px">Choisissez l'offre qui vous convient le mieux.</p><div class="actions" style="margin-top:18px"><button class="btn dark" data-go="custom">Retour</button></div></div>`}
function career(){return `<div><div class="careerhead"><div class="stat"><small>Joueur</small><strong>${esc(S.first)} ${esc(S.last)}</strong></div><div class="stat"><small>Niveau</small><strong>${S.level}</strong></div><div class="stat"><small>Âge</small><strong>${S.age} ans</strong></div><div class="stat"><small>Club</small><strong>${S.club}</strong></div><div class="stat"><small>Salaire / an</small><strong>${S.salary.toLocaleString("fr-FR")} €</strong></div>
<div class="stat"><small>Compte</small><strong>${S.money.toLocaleString("fr-FR")} €</strong></div></div><div class="card" style="margin-top:15px"><div class="row"><div><div class="eyebrow">Saison ${S.season}</div><h2>${S.age<40?"Une nouvelle décision":"Fin de carrière"}</h2></div><div class="muted">Confiance ${S.confidence}%</div></div>${S.last?`<div class="result ${S.last.injury?"injury":""}"><b>${S.last.title}</b><br>${S.last.text}</div>`:""}${S.age<40?choices():`<div class="result">Ton joueur atteint 40 ans. La carrière est terminée.</div>`}</div></div>`}
function choices(){
const events=[
 {type:"training",title:"Le coach veut te voir sur un autre registre",text:"Le coach te demande de jouer sur un autre registre pendant la séance.",options:[
  ["Accepter et jouer le jeu à fond",2,{coachRelation:4,morale:2,form:3}],
  ["Refuser fermement",-2,{coachRelation:-4}],
  ["Parler au coach",1,{coachRelation:1,morale:1}],
  ["Accepter durement",-1,{coachRelation:2,morale:-4}]
 ]},
 {type:"training",title:"Le coach te demande de travailler ton point faible",text:"Un point faible de ton jeu doit être travaillé sérieusement.",options:[
  ["Accepter et travailler sérieusement",2,{coachRelation:2,morale:1,form:3}],
  ["Refuser de travailler ce point",-2,{coachRelation:-3,morale:-1}],
  ["Demander des conseils au coach",1,{coachRelation:2,morale:1,form:1}],
  ["Faire le minimum",-1,{coachRelation:-1,morale:-1,form:1}]
 ]},
 {type:"match",title:"Une grosse occasion se présente",text:"Tu récupères le ballon dans une situation où tu peux faire basculer le match.",options:[
  ["Tenter de finir l’action",2,{confidence:2}],
  ["Faire la passe à un coéquipier",1,{teamRelation:1,confidence:1}],
  ["Prendre ton temps pour assurer",1,{form:1,performance:1}],
  ["Forcer l’action",-1,{morale:-1}]
 ]},
 {type:"match",title:"Tu dois tirer un penalty",text:"Le ballon est posé sur le point de penalty. Toute l’équipe te regarde.",options:[
  ["Prendre tes responsabilités",2,{confidence:2}],
  ["Laisser un coéquipier tirer",1,{teamRelation:1,confidence:-1}],
  ["Demander au capitaine de décider",1,{coachRelation:1,morale:1}],
  ["Tirer malgré la pression",-2,{confidence:-2}]
 ]},
 {type:"match",title:"Un coéquipier te reproche une action",text:"Après une action ratée, un coéquipier vient te parler.",options:[
  ["T’excuser et passer à autre chose",2,{teamRelation:2,morale:1}],
  ["Répondre calmement",1,{teamRelation:1,morale:1}],
  ["L’envoyer balader",-1,{teamRelation:-3,morale:-2}],
  ["Entrer dans le conflit",-2,{teamRelation:-4,morale:-3}]
 ]},
 {type:"private",title:"Ta vie personnelle commence à perturber ton football",text:"Tes problèmes personnels commencent à avoir un impact sur ta saison.",options:[
  ["Mettre le football en priorité",1,{morale:-2,form:3}],
  ["Prendre du recul",-1,{morale:2,form:-1}],
  ["Trouver un équilibre",2,{morale:2,form:1}],
  ["Tout laisser tomber quelques jours",-2,{morale:3,form:-3}]
 ]},
 {type:"private",title:"Tu reçois une bonne nouvelle qui te motive",text:"Une bonne nouvelle te donne un surplus d’énergie et de motivation.",options:[
  ["Utiliser cette énergie pour travailler",2,{morale:3,form:2}],
  ["Partager la nouvelle avec l’équipe",1,{morale:2,teamRelation:2}],
  ["Fêter ça",-1,{morale:3,form:-1}],
  ["Rester concentré sur le football",2,{morale:1,form:2}]
 ]},
 {type:"private",title:"Tu traverses une période difficile",text:"Une période compliquée commence à peser sur ton quotidien.",options:[
  ["En parler à quelqu’un",1,{morale:2}],
  ["Te réfugier dans le football",1,{morale:-1,form:3}],
  ["Prendre du temps pour toi",1,{morale:3,form:-1}],
  ["Tout garder pour toi",-2,{morale:-3,form:-2}]
 ]},
 {type:"private",title:"Une personne importante te demande plus de temps",text:"Une personne importante dans ta vie te demande de lui accorder davantage de temps.",options:[
  ["Lui accorder du temps",1,{morale:3,form:-1}],
  ["Expliquer que le football est prioritaire",-1,{morale:-1,form:2}],
  ["Trouver un compromis",2,{morale:2,form:1}],
  ["Refuser catégoriquement",-2,{morale:-3,form:2}]
 ]}
];
const e=events[S.currentChoice]||events[0];
return `<p class="muted">Choix ${S.currentChoice+1} / ${events.length}</p><h3>${e.title}</h3><p>${e.text}</p>
<div class="choice-list">${e.options.map((o,i)=>`<button class="eventchoice" data-choice-index="${i}" data-choice-delta="${o[1]}" data-choice-effects='${JSON.stringify(o[2])}'><span class="tag">${e.type==="training"?"Entraînement":e.type==="match"?"Match":"Vie privée"}</span><br><b>${o[0]}</b></button>`).join("")}</div>
<div class="notice">Une décision positive fait progresser ton niveau, une décision négative le fait baisser.</div>`;
}
function scenario(type){if(type==="training")return `<div class="card"><div class="eyebrow">Entraînement</div><h2>Jour d'entraînement, le coach veut vous voir dans un autre rôle.</h2><div class="choice-list">
<button class="eventchoice" data-answer="coach1">Écouter le coach et jouer le jeu</button>
<button class="eventchoice" data-answer="coach2">Refuser</button>
<button class="eventchoice" data-answer="coach3">Parler au coach</button>
<button class="eventchoice" data-answer="coach4">Jouer tout en étant de mauvaise humeur</button></div></div>`;
if(type==="match")return `<div class="card"><div class="eyebrow">Match</div><h2>Une situation importante se présente sur le terrain.</h2><div class="choice-list"><button class="eventchoice" data-answer="m1">Prendre l'initiative</button><button class="eventchoice" data-answer="m2">Jouer simple et assurer</button><button class="eventchoice" data-answer="m3">Prendre un risque</button></div></div>`;
return `<div class="card"><div class="eyebrow">Vie privée</div><h2>Une décision personnelle se présente.</h2><div class="choice-list"><button class="eventchoice" data-answer="p1">Privilégier ma carrière</button><button class="eventchoice" data-answer="p2">Prendre du temps pour moi</button><button class="eventchoice" data-answer="p3">Trouver un équilibre</button></div></div>`}
function result(answer,delta,effects={}){
S.level=Math.max(1,Math.min(99,S.level+delta));
Object.entries(effects).forEach(([key,value])=>{
 if(typeof S[key]==="number") S[key]=Math.max(0,Math.min(100,S[key]+value));
});
let label=delta>0?"Progression positive":delta<0?"Baisse de niveau":"Niveau inchangé";
S.last={title:label,text:`Ton niveau évolue de ${delta>0?"+":""}${delta}. Niveau actuel : ${S.level}.`,injury:false};
if(Math.random()<.10)S.last={title:"Blessure inattendue",text:"Une blessure survient et perturbe la saison.",injury:true};
if(S.currentChoice<8){S.currentChoice++;S.screen="career";render();return;}
S.money+=S.salary;S.season++;S.currentChoice=0;
if(S.age<40)S.age++;
S.last={title:"Fin de saison",text:`Ta saison est terminée. Ton salaire annuel de ${S.salary.toLocaleString("fr-FR")} € a été versé sur ton compte.`,injury:false};
S.screen="career";render();
}
function randomLevel(){S.level=Math.floor(Math.random()*60)+40;S.division=S.level<=55?"L3":S.level<=65?"L2":"L1";S.offers=null}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.go;render()});document.getElementById("shop")?.addEventListener("click",()=>document.getElementById("shopmsg").textContent="La Boutique sera ajoutée plus tard.");document.querySelectorAll("[data-nation]").forEach(b=>b.onclick=()=>{S.nation=b.dataset.nation;render()});document.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{S.skin=b.dataset.skin;render()});document.querySelectorAll("[data-hair]").forEach(b=>b.onclick=()=>{S.haircut=b.dataset.hair;render()});document.querySelectorAll("[data-haircolor]").forEach(b=>b.onclick=()=>{S.hairColor=b.dataset.haircolor;render()});document.getElementById("toClub")?.addEventListener("click",()=>{S.first=document.getElementById("first").value.trim();S.last=document.getElementById("last").value.trim();S.birth=document.getElementById("birth").value;S.position=document.getElementById("position").value;S.age=ageFromDate(S.birth);if(!S.first||!S.last||!S.nation||!S.position||S.age===null||S.age<16||S.age>40){alert("Complète les informations et choisis un âge entre 16 et 40 ans.");return}randomLevel();S.screen="club";render()});document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>{S.club=b.dataset.club;S.clubChosen=true;S.salary=S.division==="L3"?30000:S.division==="L2"?75000:250000;S.currentChoice=0;S.screen="career";render()});document.querySelectorAll("[data-scenario]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.scenario;render()});
document.querySelectorAll("[data-choice-index]").forEach(b=>b.onclick=()=>result(b.dataset.choiceIndex,Number(b.dataset.choiceDelta)))}
render=()=>{document.getElementById("app").innerHTML=S.screen==="home"?home():S.screen==="nation"?nation():S.screen==="custom"?custom():S.screen==="club"?club():S.screen==="career"?career():scenario(S.screen);bind()};render();
</script>
