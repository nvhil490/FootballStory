<style>

.custom{display:grid;grid-template-columns:340px 1fr;gap:24px}.avatarbox{background:#0a100d;border:1px solid #26342c;border-radius:20px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:510px}.avatar{width:260px;height:330px}.avatar svg{width:100%;height:100%}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.swatch.selected{border-color:#fff}.hair-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hair{padding:12px 8px;background:#111b16;color:#fff;border:1px solid #26342c;border-radius:11px}.hair.selected{border-color:#35dd80;background:#183d2b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#9da9a2}.field input,.field select{background:#09100c;border:1px solid #29382f;color:white;padding:12px;border-radius:11px}

.dots{display:flex;gap:5px;margin:10px 0 14px}.dots i{flex:1;height:5px;border-radius:9px;background:#22302a}.dots i.on{background:#35dd80}.dots i.cur{background:#f0b840}

.result{background:linear-gradient(180deg,#112018,#0b120e);line-height:1.6;font-size:14px}.result b{font-size:15px;color:#fff}
@media(max-width:520px){.pcard{grid-template-columns:64px 1fr auto}.pface{width:64px;height:72px}.lvl{width:62px;height:62px}.lvl b{font-size:19px}.g{grid-template-columns:96px 1fr 26px}}

.sumpage{text-align:center}.sumpage h2{margin:2px 0}.bigrate{width:132px;height:132px;border-radius:50%;margin:18px auto;display:grid;place-content:center;background:radial-gradient(circle at 35% 30%,#4cf08f,#1b9a52);color:#04120a;box-shadow:0 10px 36px #2fd47750}.bigrate b{font-size:42px;line-height:1}.bigrate small{font-size:10px;font-weight:800;letter-spacing:1px;margin-top:3px}.lines{display:grid;gap:8px;margin:16px 0;text-align:left}.lines div{background:#0d1511;border:1px solid #26342c;border-radius:12px;padding:10px 12px;font-size:14px}.sumpage .btn{width:100%;margin-top:16px;padding:16px;font-size:16px}
.t-club{color:#c792ff;background:#c792ff18}.t-media{color:#ff8fb1;background:#ff8fb118}.t-career{color:#ffd166;background:#ffd16618}
</style>

<script>
const countryCats={

"Amérique":[["🇲🇽","Mexique"],["🇨🇴","Colombie"],["🇦🇷","Argentine"],["🇧🇷","Brésil"],["🇺🇸","États-Unis"],["🇨🇦","Canada"]]
};
const clubs={
L1:["Paris","Marseille","Lyon","Monaco","Lille","Rennes","Angers","Le Mans","Lens","Paris CF","Strasbourg","Auxerre","Brest","Lorient","Toulouse","Nice","Troyes","Le Havre"],
L2:["Saint-Étienne","Red Star","Reims","Montpellier","Metz","Nancy-Lorraine","Annecy","Sochaux-Montbéliard","Dijon","Pau","Guingamp","Dunkerque","Grenoble","Rodez","Nantes","Clermont","Boulogne","Laval"],
L3:["La Roche","Rouen","Concarneau","Versailles","Amiens","Cannes","Caen","Le Puy","Fleury","Thionville","Paris 13","Bastia","QRM","Orléans","Valenciennes","Aubagne","Bourg-en-Bresse","Villefranche"]};
const skins=["#f8dcc8","#edc2a5","#d9a17e","#bd805d","#965b3e","#70432f","#4b2b20"];
const hairs=["Court", "Dégradé", "Dégradé + dessus long", "Bouclé", "Afro", "Dreadlocks", "Tresses", "Mi-long", "Long", "Rasé"];
const hairColors=[["Noir","#15110e"],["Brun","#4a2d1d"],["Châtain","#765035"],["Blond","#d8b46a"],["Roux","#9a4d2e"],["Gris","#9b9b91"]];
const positions=["BU","AG","AD","MOC","MC","DG","DD","DC","GK"];
const S={screen:"home",nation:null,skin:skins[3],haircut:"Dégradé",hairColor:"#15110e",first:"",family:"",birth:"",age:0,position:null,level:0,division:null,club:null,money:1000,season:1,confidence:50,performance:50,morale:50,coachRelation:50,teamRelation:50,form:50,last:null,clubChosen:false};

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ageFromDate(v){if(!v)return null;let d=new Date(v),n=new Date(),a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))a--;return a}
function shade(h,p){const n=parseInt(h.slice(1),16),f=x=>Math.max(0,Math.min(255,Math.round(p<0?x*(1+p):x+(255-x)*p)));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
const cp=(d,c,o=1)=>`<path d="${d}" fill="${c}" opacity="${o}"/>`;
const cr=(a,c)=>a.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('');
const CAP="M70 116Q62 36 130 28Q198 36 190 116Q184 86 160 78Q130 70 100 78Q76 86 70 116Z";
const CAPS="M71 114Q66 46 130 38Q194 46 189 114Q184 90 160 82Q130 75 100 82Q76 90 71 114Z";
const FADE="M70 116Q68 86 84 70L88 112Z M190 116Q192 86 176 70L172 112Z";
function hairParts(h,c,id,sk){
 const F=`url(#${id}h)`,d=shade(c,-.5),l=shade(c,.4),sc=shade(sk,-.5);let b="",f="",k=0;
 const P=(p,o=1,fill=F)=>`<path d="${p}" fill="${fill}" opacity="${o}" stroke="${l}" stroke-opacity=".3" stroke-width="1"/>`;
 const L=(p,w=1.6,o=.5,col=d)=>`<path d="${p}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${o}"/>`;
 const tw=(p,w,da="1.5 5")=>`<path d="${p}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/><path d="${p}" stroke="${l}" stroke-opacity=".18" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${da}" fill="none"/>`;
 const lock=(x,y,n,w)=>{const s=x<130?-1:1;return tw(`M${x} ${y}q${4*s} ${n/2} ${-2*s} ${n}`,w)};
 const cl=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${d}"/><circle cx="${x-r*.08}" cy="${y-r*.1}" r="${r*.88}" fill="${F}" stroke="${l}" stroke-opacity=".3"/><circle cx="${x-r*.35}" cy="${y-r*.42}" r="${r*.26}" fill="${l}" opacity=".4"/>`;
 const C=a=>[...a].sort((u,v)=>Math.abs(v[0]-130)-Math.abs(u[0]-130)||u[1]-v[1]).map(([x,y,r])=>cl(x.toFixed(1),y.toFixed(1),r)).join("");
 const arc=(r,a0,a1,n,cr)=>{const a=[];for(let i=0;i<n;i++){const q=(a0+(a1-a0)*i/(n-1))*Math.PI/180;a.push([130+r*Math.cos(q),94+r*Math.sin(q),cr])}return a};
 const sh=p=>`<path d="${p}" transform="translate(0 5)" fill="#000" opacity=".22"/>`;
 const clip=(p,x)=>{const n=id+"k"+k++;return`<clipPath id="${n}"><path d="${p}"/></clipPath><g clip-path="url(#${n})">${x}</g>`};
 const HL="M70 116Q76 86 100 78Q130 70 160 78Q184 86 190 116";
 const fade=P(FADE,.3,"#000");
 const strands=(n,y0)=>{let s="";for(let i=0;i<n;i++){const t=i/(n-1)*2-1;s+=L(`M${130+t*8} 36Q${130+t*34} 44 ${130+t*60} ${y0-Math.abs(t)*10}`,1.5,.4)}return s};
 const CL="M72 84Q62 130 72 190Q86 174 90 150Q92 118 100 88Z",CR="M188 84Q198 130 188 190Q174 174 170 150Q168 118 160 88Z";
 const part=L("M130 30V76",2.4,.7);
 switch(h){
 case"Dégradé":f=sh(CAPS)+P(CAPS)+C([...arc(46,200,340,14,10),...arc(30,215,325,7,10),[130,66,11]])+fade;break;
 case"Dégradé + dessus long":f=sh(CAPS)+P(CAPS)+C([...arc(54,195,345,14,13),...arc(38,205,335,9,13),...arc(20,225,315,4,13),[130,72,12],[116,32,14],[130,28,15],[144,32,14]])+fade;break;
 case"Bouclé":b=C([...arc(60,148,205,7,15),...arc(60,335,392,7,15)]);f=sh(CAP)+P(CAP)+C([...arc(56,195,345,14,14),...arc(40,205,335,10,14),...arc(24,230,310,5,13),[130,70,12]]);break;
 case"Afro":b=`<circle cx="130" cy="92" r="66" fill="${d}"/>`+C(arc(76,138,402,23,18))+`<circle cx="130" cy="94" r="64" fill="${F}"/>`;f=sh(CAP)+P(CAP)+C([...arc(54,192,348,15,15),...arc(38,205,335,10,15),...arc(20,230,310,5,14),[130,68,13]]);break;
 case"Dreadlocks":{let q="";for(let x=48;x<=76;x+=7){q+=lock(x,92,118+(x*7%5)*7,11)+lock(260-x,92,118+(x*3%5)*7,11)}
  b=q;f=sh(CAP)+P(CAP)+clip(CAP,[-5,-4,-3,-2,-1,1,2,3,4,5].map(t=>tw(`M${130+t*3} 38Q${130+t*15} 50 ${130+t*16} 110`,7)).join(""))+part+[62,70,190,198].map(x=>lock(x,88,100,9)).join("");break}
 case"Tresses":f=sh(CAPS)+P(CAPS,1,sc)+clip(CAPS,[0,1,2,3,4,5,6,7].map(i=>{const x=88+i*12,e=130+(x-130)*.25;return tw(`M${x} 104Q${x+(x<130?-4:4)} 58 ${e} 30`,7.5,"2.5 2.5")}).join(""))+fade;break;
 case"Mi-long":b=P("M64 116Q58 40 130 28Q202 40 196 116Q200 150 194 184Q175 174 160 186Q145 174 130 188Q115 174 100 186Q85 174 66 184Q60 150 64 116Z");
  f=sh(CAP)+P(CAP)+clip(CAP,[-1,-.6,.6,1].map(t=>L(`M${130+t*6} 30Q${130+t*30} 54 ${130+t*62} 104`)).join(""))+P(CL)+P(CR)+clip(CL,L("M80 90Q70 140 76 184")+L("M88 96Q84 140 84 170"))+clip(CR,L("M180 90Q190 140 184 184")+L("M172 96Q176 140 176 170"))+part+L(HL,2,.45);break;
 case"Long":b=P("M62 116Q56 38 130 26Q204 38 198 116L208 262Q130 274 52 262Z");
  f=sh(CAP)+P(CAP)+clip(CAP,[-1,-.6,.6,1].map(t=>L(`M${130+t*6} 30Q${130+t*30} 54 ${130+t*62} 104`)).join(""))+P("M72 84Q58 140 68 228Q84 198 90 150Q92 118 100 88Z")+P("M188 84Q202 140 192 228Q176 198 170 150Q168 118 160 88Z")+L("M76 112Q66 170 72 214",1.6,.4)+L("M184 112Q194 170 188 214",1.6,.4)+part+L(HL,2,.45);break;
 case"Rasé":f=P("M72 112Q68 52 130 46Q192 52 188 112Q182 90 160 84Q130 77 100 84Q78 90 72 112Z",.3)+P("M100 58Q130 44 160 58Q130 52 100 58Z",.2,"#fff");break;
 case"Frange":{const fr="M74 110Q72 68 130 64Q188 68 186 110Q176 96 160 104Q144 94 130 104Q114 94 100 104Q84 96 74 110Z";f=sh(CAP)+P(CAP)+P(fr)+clip(fr,[-3,-2,-1,0,1,2,3].map(i=>L(`M${130+i*14} 60Q${130+i*14} 88 ${130+i*15} 106`,1.5,.45)).join(""))+fade;break}
 case"Originale":{const q="M96 76Q92 34 116 24Q130 18 144 24Q168 34 164 76Q130 62 96 76Z";f=sh(CAPS)+P(CAPS,.6)+fade+P(q)+clip(q,[-3,-2,-1,0,1,2,3].map(i=>L(`M${130+i*8} 74Q${130+i*9} 50 ${130+i*7} 20`,1.6,.45)).join(""));break}

function home(){return `<section class="home"><div><div class="eyebrow">Mode carrière</div><h1 class="logo">Football<b>Story</b></h1><p>« Un nom, une nation, un club… et peut-être une des plus belles histoires qui va s’écrire. »</p><div class="actions" style="justify-content:center"><button class="btn" data-go="nation">Nouvelle partie</button><button class="btn dark" id="shop">Boutique</button></div><p id="shopmsg" class="muted"></p></div></section>`}
function nation(){return `<div class="card"><div class="row"><div><div class="eyebrow">Étape 1</div><h2>Choisis ta nation</h2></div></div><p class="muted">Choisis une nation parmi les catégories disponibles.</p><div class="countries">${Object.entries(countryCats).map(([cat,arr])=>`<section class="country-cat"><h3>${cat}</h3>${arr.map(([f,n])=>`<button class="country ${S.nation===n?"selected":""}" data-nation="${n}">${f} ${n}</button>`).join("")}</section>`).join("")}</div><div class="actions" style="margin-top:18px;justify-content:space-between"><button class="btn dark" data-go="home">Retour</button><button class="btn" data-go="custom" ${S.nation?"":"disabled"}>Continuer</button></div></div>`}
function custom(){return `<div class="card"><div class="row"><div><div class="eyebrow">Étape 2</div><h2>Crée ton joueur</h2></div><span class="muted">${S.nation}</span></div><div class="custom">
<div class="avatarbox"><div class="avatar">${avatar()}</div><strong>${esc(S.first||"Ton joueur")} ${esc(S.family)}</strong><span class="muted">${S.position||"Position à choisir"}</span></div>
<div>
<h3>Apparence</h3><div class="eyebrow" style="margin:18px 0 8px">Coupe de cheveux</div><div class="hair-grid">${hairs.map(x=>`<button class="hair ${S.haircut===x?"selected":""}" data-hair="${x}">${avatar(x,{thumb:1})}<span>${x}</span></button>`).join("")}</div>
<h3 style="margin-top:22px">Identité</h3><div class="form">
<div class="field"><label>Prénom</label><input id="first" value="${esc(S.first)}"></div><div class="field"><label>Nom</label><input id="last" value="${esc(S.family)}"></div>
<div class="field"><label>Date de naissance</label><input id="birth" type="date" value="${S.birth}"></div>
<div class="field"><label>Position</label><select id="position"><option value="">Choisir</option>${positions.map(x=>`<option ${S.position===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
<div class="actions" style="margin-top:20px"><button class="btn dark" data-go="nation">Retour</button><button class="btn" id="toClub">Continuer vers le club</button></div>
</div></div></div>`}
function club(){let lvl=f1(S.level);let div=S.division;
if(!S.offers){S.offers=[...clubs[div]].sort(()=>Math.random()-.5).slice(0,4);S.play={};S.offers.forEach(c=>S.play[c]=["Élevé","Moyen","Faible"][Math.floor(Math.random()*3)])}
return `<div class="card"><div class="eyebrow">${S.season>1?"Mercato • Nouveau club":"Étape 3 • Première signature"}</div><h2>4 clubs veulent vous recruter</h2><p class="muted">Votre niveau <b style="color:#fff">${lvl}</b> vous ouvre ces quatre possibilités en <b style="color:#fff">${div}</b>.</p><div class="notice" style="padding:12px;margin-bottom:15px">L3 : 40–55 &nbsp;•&nbsp; L2 : 55–65 &nbsp;•&nbsp; L1 : 65–99</div><div class="clubgrid">${S.offers.map((c,i)=>{let play=S.play[c];return `<button class="club" data-club="${c}"><span class="tag">Offre ${i+1}</span><b>${c}</b><small>${div} • Niveau ${lvl}</small><small>Temps de jeu estimé : ${play}</small><small>Salaire : ${salaryFor(c).toLocaleString("fr-FR")} € / an</small></button>`}).join("")}</div><p class="muted" style="margin-top:15px">Choisissez l'offre qui vous convient le mieux.</p><div class="actions" style="margin-top:18px">${S.season>1?`<button class="btn dark" data-go="career">Rester à ${esc(S.club)}</button>`:`<button class="btn dark" data-go="custom">Retour</button>`}</div></div>`}
function summaryPage(){const m=S.summary,T=S.tot,gk=S.position==="GK",r=m.m?m.r.toFixed(1):"—";
 const tl=gk?[[m.m,"Matchs"],[m.cs,"Clean sheets"],[m.t.length,"Trophées"]]:[[m.m,"Matchs"],[m.g,"Buts"],[m.a,"Passes D."],[m.t.length,"Trophées"]];
 return `<div class="card sumpage"><div class="eyebrow">Fin de saison ${m.season}</div><h2>${esc(S.first)} ${esc(S.family)}</h2><div class="muted">${esc(m.club)} • ${m.age} ans</div>
<div class="bigrate"><b>${r}</b><small>NOTE MOYENNE</small></div>
<div class="tiles" style="grid-template-columns:repeat(${tl.length},1fr)">${tl.map(([v,n])=>`<div><b>${v}</b><small>${n}</small></div>`).join("")}</div>
${m.t.length?`<div class="trophies" style="justify-content:center">${m.t.map(x=>`<span>🏆 ${x}</span>`).join("")}</div>`:""}
<div class="lines">${S.sumLines.slice(1).map(x=>`<div>${x}</div>`).join("")}</div>
<div class="muted tot">Carrière : ${T.m} matchs • ${gk?T.cs+" clean sheets":T.g+" buts • "+T.a+" passes D."} • ${T.t} trophées</div>
<button class="btn" id="cont">Continuer</button></div>`}
function career(){
 const col=v=>v<35?"#ef5b5b":v<55?"#f0b840":"#35dd80",IC={morale:"😊",form:"⚡",confidence:"🎯",coachRelation:"🧑‍🏫",teamRelation:"🤝"};

 const before=S.level;S.level=Math.round(cl(S.level+d,1,99)*100)/100;
 Object.entries(effects).forEach(([k,v])=>{if(STATS[k]){const o=S[k];S[k]=cl(o+v*2);if(S[k]!==o)L.push(`${STATS[k]} ${sg(S[k]-o)}`)}});
 const inj=Math.random()<(S.form<35?.16:.06);
 if(inj){S.inj=(S.inj||0)+1;S.level=cl(S.level-1,1,99);S.form=cl(S.form-15);S.morale=cl(S.morale-8);L.push("Blessure : -1 niveau, forme -15, moral -8")}
 S.performance=Math.round((S.form+S.confidence+S.morale)/3);
 L.unshift(`Niveau ${f1(before)} → ${f1(S.level)} (${sg(Math.round((S.level-before)*10)/10)})`);
 S.last={title:inj?"Blessure inattendue":d>0?"Bonne décision":d<0?"Mauvaise décision":"Décision neutre",text:L.join("<br>"),injury:inj};
 if(S.currentChoice<8){S.currentChoice++;S.screen="career";render();return}
 const avg=Math.round(Object.keys(STATS).reduce((t,k)=>t+S[k],0)/5);
 const sd=avg>=75?2:avg>=62?1:avg>=45?0:avg>=30?-1:-2;
 const ag=S.age<=20?1.5:S.age<=23?1:S.age<=29?0:S.age<=32?-1:-2,lv=S.level;
 let tot=sd+ag;if(tot>0)tot=Math.round(tot*cl((99-lv)/50,.15,1)*10)/10;
 S.level=Math.round(cl(lv+tot,1,99)*100)/100;
 const paid=S.salary;S.money+=paid;
 const st=seasonStats(avg);S.summary=st;const T=S.tot||(S.tot={m:0,g:0,a:0,t:0});T.m+=st.m;T.g+=st.g;T.a+=st.a;T.cs=(T.cs||0)+st.cs;T.t+=st.t.length;S.inj=0;
 const E=[`Bilan de la saison ${S.season} : jauges ${avg}/100`,`Niveau ${f1(lv)} → ${f1(S.level)} (${sg(tot)} : jauges ${sg(sd)}, âge ${sg(ag)})`,`Salaire versé : ${paid.toLocaleString("fr-FR")} €`];
 const nd=divOf(S.level);let go="career";
 if(nd!==S.division){E.push(RK[nd]>RK[S.division]?`Tes performances attirent de plus grands clubs (${nd}).`:`Ton niveau baisse : des clubs de ${nd} te contactent.`);S.division=nd;S.offers=null;go="club"}
 Object.keys(STATS).forEach(k=>S[k]=Math.round((S[k]+50)/2));
 S.performance=Math.round((S.form+S.confidence+S.morale)/3);
 if(S.age<40)S.age++;S.season++;S.salary=salaryFor();if(go==="career")E.push(`Nouveau contrat : ${S.salary.toLocaleString("fr-FR")} € / an`);S.currentChoice=0;S.order=null;
 S.last=null;S.sumLines=E;S.next=go;S.screen="summary";render();
}
function randomLevel(){S.level=40+Math.floor(Math.pow(Math.random(),1.4)*36);S.division=S.level<=55?"L3":S.level<=65?"L2":"L1";S.offers=null}
function bind(){document.getElementById("cont")?.addEventListener("click",()=>{S.screen=S.next||"career";render()});["first","last","birth","position"].forEach(i=>{const e=document.getElementById(i);if(e)e.oninput=e.onchange=()=>{S[i==="last"?"family":i]=e.value}});document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.go;render()});document.getElementById("shop")?.addEventListener("click",()=>document.getElementById("shopmsg").textContent="La Boutique sera ajoutée plus tard.");document.querySelectorAll("[data-nation]").forEach(b=>b.onclick=()=>{S.nation=b.dataset.nation;render()});document.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{S.skin=b.dataset.skin;render()});document.querySelectorAll("[data-hair]").forEach(b=>b.onclick=()=>{S.haircut=b.dataset.hair;render()});document.querySelectorAll("[data-haircolor]").forEach(b=>b.onclick=()=>{S.hairColor=b.dataset.haircolor;render()});document.getElementById("toClub")?.addEventListener("click",()=>{S.first=document.getElementById("first").value.trim();S.family=document.getElementById("last").value.trim();S.birth=document.getElementById("birth").value;S.position=document.getElementById("position").value;S.age=ageFromDate(S.birth);if(!S.first||!S.family||!S.nation||!S.position||S.age===null||S.age<16||S.age>40){alert("Complète les informations et choisis un âge entre 16 et 40 ans.");return}randomLevel();S.screen="club";render()});document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>{S.club=b.dataset.club;S.clubChosen=true;S.salary=salaryFor(S.club);S.pt=(S.play||{})[S.club]||"Moyen";S.currentChoice=0;S.order=null;S.screen="career";render()});document.querySelectorAll("[data-scenario]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.scenario;render()});
document.querySelectorAll("[data-choice-index]").forEach(b=>b.onclick=()=>result(b.dataset.choiceIndex,Number(b.dataset.choiceDelta),JSON.parse(b.dataset.choiceEffects||"{}"),Number(b.dataset.choiceRisk||0)))}
render=()=>{document.getElementById("app").innerHTML=S.screen==="home"?home():S.screen==="nation"?nation():S.screen==="custom"?custom():S.screen==="club"?club():S.screen==="career"?career():S.screen==="summary"?summaryPage():scenario(S.screen);bind()};render();
</script></body></html>
